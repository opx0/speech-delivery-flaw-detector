name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System audio tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.0"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Pin npm
        run: npm install --global npm@12.2.0
      - name: Install locked Python dependencies
        run: uv sync --locked
      - name: Install locked Node dependencies
        working-directory: web
        run: npm ci
      - name: Python checks
        run: |
          uv run --no-sync ruff format --check .
          uv run --no-sync ruff check .
          uv run --no-sync pyright
      - name: Frontend checks
        working-directory: web
        run: |
          npm run typecheck
          npm run build
      - name: Generated files are up to date
        run: |
          uv run --no-sync python scripts/export_contract.py
          npm --prefix web run contract:ts
          git diff --exit-code
